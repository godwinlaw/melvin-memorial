<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Wall — For Melvin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0a1422;
    --navy: #0f1d31;
    --brass: #c89968;
    --brass-light: #e2c089;
    --ivory: #f3ead7;
    --ivory-soft: #d8cdb4;
    --paper-1: #ffd28c;
    --paper-2: #b97246;
    --glow: rgba(255,180,100,0.4);
    --serif: "Cormorant Garamond", "Newsreader", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
    --title-h: 96px;
    --gap: 16px;
    --lantern-h: 60vh;
    --lantern-w: 40vh;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ivory);
    background:
      radial-gradient(ellipse at 50% 100%, var(--glow), transparent 65%),
      radial-gradient(2px 2px at 12% 18%, rgba(255,225,170,0.45), transparent 50%),
      radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,225,170,0.4), transparent 50%),
      radial-gradient(1px 1px at 32% 64%, rgba(255,225,170,0.35), transparent 50%),
      radial-gradient(1.5px 1.5px at 88% 78%, rgba(255,225,170,0.4), transparent 50%),
      radial-gradient(1px 1px at 50% 38%, rgba(255,225,170,0.3), transparent 50%),
      radial-gradient(2px 2px at 8% 90%, rgba(255,225,170,0.35), transparent 50%),
      radial-gradient(1px 1px at 65% 55%, rgba(255,225,170,0.3), transparent 50%),
      linear-gradient(180deg, #060d18 0%, var(--navy-deep) 60%, #050a13 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  .stage-title {
    position: fixed; top: 24px; left: 0; right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }
  .stage-title small {
    display: block;
    color: var(--brass);
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-bottom: 6px;
    text-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
  .stage-title strong {
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(22px, 2vw, 30px);
    color: var(--ivory-soft);
    letter-spacing: 0.04em;
    text-shadow: 0 0 24px rgba(0,0,0,0.7);
  }

  .stage {
    position: fixed;
    top: var(--title-h);
    left: 0; right: 0; bottom: 0;
  }

  .marquee {
    width: 100%;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    /* hide scrollbar but keep scrollability */
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* horizontal-only momentum on touch */
    overscroll-behavior: contain;
    cursor: grab;
  }
  .marquee.is-grabbing { cursor: grabbing; }
  .marquee::-webkit-scrollbar { display: none; }

  /* Edge fades sit ABOVE the scroll container so they don't move with content. */
  .stage::before,
  .stage::after {
    content: "";
    position: absolute; top: 0; bottom: 0;
    width: 80px;
    z-index: 4;
    pointer-events: none;
  }
  .stage::before {
    left: 0;
    background: linear-gradient(90deg, var(--navy-deep), transparent);
  }
  .stage::after {
    right: 0;
    background: linear-gradient(270deg, var(--navy-deep), transparent);
  }

  .track {
    display: flex;
    align-items: center;
    gap: var(--gap);
    padding: 0 var(--gap);
    height: 100%;
    width: max-content;
    will-change: transform;
  }

  .empty {
    width: 100vw;
    text-align: center;
    color: var(--ivory-soft);
    font-family: var(--serif);
    font-size: 24px;
    font-style: italic;
    opacity: 0.7;
  }

  .lantern {
    flex: 0 0 auto;
    width: var(--lantern-w);
    height: var(--lantern-h);
    position: relative;
    isolation: isolate;
    user-select: none;
  }
  .lantern::before {
    content: ""; position: absolute; left: 50%; top: -22px;
    width: 1px; height: 22px;
    background: linear-gradient(180deg, transparent, rgba(255,225,170,0.5));
    transform: translateX(-50%);
  }

  .body {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 10px;
    background: radial-gradient(ellipse at 50% 35%, var(--paper-1) 0%, var(--paper-2) 100%);
    border: 1px solid rgba(255,225,170,0.55);
    box-shadow:
      0 0 36px var(--glow),
      0 0 72px rgba(255,160,80,0.22),
      inset 0 0 28px rgba(255,230,180,0.5);
    color: #2a1608;
    padding: 22px 22px 26px;
    text-align: left;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .body::before {
    content: ""; position: absolute; left: 50%; top: -1px;
    transform: translate(-50%, -50%);
    width: 64%; height: 9px;
    background: rgba(80,40,15,0.6);
    border-radius: 5px;
  }
  .body::after {
    content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
    width: 20px; height: 13px;
    background: linear-gradient(180deg, var(--paper-2), transparent);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 6px 10px var(--glow));
  }

  .name {
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.15;
    font-weight: 600;
    color: #3a1d08;
    margin: 0 0 4px;
  }
  .role {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(58,29,8,0.7);
    margin-bottom: 14px;
    min-height: 12px;
  }
  .text {
    font-family: var(--serif);
    font-size: var(--text-size, 18px);
    line-height: 1.45;
    color: #2a1608;
    white-space: pre-wrap;
    word-wrap: break-word;
    flex: 1 1 auto;
    overflow: hidden;
  }

  .photo {
    flex: 0 0 auto;
    position: relative;
    margin: -22px -22px 16px;
    height: 42%;
    overflow: hidden;
    background: #1a0e05;
    border-radius: 10px 10px 0 0;
  }
  .photo .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .photo .slide.is-active { opacity: 1; }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
    pointer-events: none;
  }
  .photo .dots {
    position: absolute; left: 0; right: 0; bottom: 8px;
    display: flex; justify-content: center; gap: 6px;
    pointer-events: none;
  }
  .photo .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.45);
    transition: background 0.4s ease;
  }
  .photo .dot.is-active { background: var(--brass-light); }

  /* ─── floating controls ─── */
  .controls {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    background: rgba(10,20,34,0.78);
    border: 1px solid rgba(200,153,104,0.35);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    color: var(--ivory-soft);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: opacity 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .controls.is-hidden { opacity: 0; pointer-events: none; }
  .controls button {
    background: transparent;
    border: 1px solid rgba(200,153,104,0.35);
    color: var(--ivory-soft);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: grid; place-items: center;
    font: inherit;
    font-size: 14px;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .controls button:hover { color: var(--brass-light); border-color: var(--brass); background: rgba(200,153,104,0.1); }
  .controls button:focus-visible { outline: 2px solid var(--brass-light); outline-offset: 2px; }
  .controls button[disabled] { opacity: 0.35; cursor: default; }
  .controls .play svg { width: 14px; height: 14px; fill: currentColor; }
  .controls .speed-label {
    min-width: 64px;
    text-align: center;
    color: var(--brass-light);
    padding: 0 8px;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .controls .divider {
    width: 1px; height: 22px;
    background: rgba(200,153,104,0.25);
    margin: 0 4px;
  }
  .controls .hint {
    color: var(--ivory-soft);
    opacity: 0.55;
    font-size: 10px;
    letter-spacing: 0.22em;
    padding: 0 10px 0 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .photo .slide { transition: none; }
  }
  @media (max-width: 640px) {
    .controls .hint { display: none; }
  }
</style>
<script src="scripts/lantern-wall-display.js" defer></script>
</head>
<body>

<div class="stage-title">
  <small>Lantern Wall</small>
  <strong>In honored memory of Melvin Lum</strong>
</div>

<div class="stage">
  <div class="marquee" id="marquee">
    <div class="track" id="track">
      <div class="empty">Lighting the lanterns…</div>
    </div>
  </div>
</div>

<div class="controls" id="controls" role="toolbar" aria-label="Lantern wall playback">
  <button type="button" class="speed-down" id="speedDown" aria-label="Slower">−</button>
  <span class="speed-label" id="speedLabel" aria-live="polite">20 px/s</span>
  <button type="button" class="speed-up" id="speedUp" aria-label="Faster">+</button>
  <span class="divider" aria-hidden="true"></span>
  <button type="button" class="play" id="playBtn" aria-label="Pause">
    <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>
  </button>
  <span class="hint">Drag · Scroll · Swipe</span>
</div>

</body>
</html>
